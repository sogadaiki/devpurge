name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: |
          chmod +x bin/devpurge
          chmod +x test/run_tests.sh

      - name: Run tests
        run: bash test/run_tests.sh

      - name: Verify weekly report fallback
        run: python3 test/test_triage_report.py

      - name: Verify archive retention guards
        run: python3 test/test_archive.py

      - name: Verify Storage Studio safety and local API
        run: python3 test/test_studio.py

      - name: Verify render cleanup and Codex failure guards
        run: python3 test/test_render_care.py

      - name: Verify ended job recovery guards
        run: python3 test/test_job_recovery.py

      - name: Verify AI cleanup authority and failure guards
        run: python3 test/test_cleanup_assistant.py

      - name: Verify expanded cleanup scope guards
        run: python3 test/test_expanded_scope.py

      - name: Verify quarantine disposal and restore guards
        run: python3 test/test_quarantine_store.py

      - name: Verify native lifecycle and installer rollback
        run: python3 test/test_native.py

      - name: Verify refresh UI state and recording timer
        run: node test/test_refresh_ui.js

      - name: Compile and verify native Mac application
        run: python3 scripts/install-studio-app.py --output "$RUNNER_TEMP/devpurge Studio.app"

      - name: Verify --help
        run: ./bin/devpurge --help

      - name: Verify --version
        run: ./bin/devpurge --version

      - name: Verify dry run
        run: ./bin/devpurge --dry-run --no-color
